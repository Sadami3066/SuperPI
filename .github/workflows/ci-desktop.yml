name: Desktop CI (Windows / macOS / Linux)

on:
  push:
    branches: [main, master]
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "apps/host/**"
      - "core/**"
      - ".github/workflows/ci-desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "apps/host/**"
      - "core/**"
      - ".github/workflows/ci-desktop.yml"
  workflow_dispatch:

jobs:
  verify-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target_platform: linux-x64
            builder_args: "--linux deb"
          - os: windows-latest
            target_platform: windows-x64
            builder_args: "--win nsis"
          - os: macos-latest
            target_platform: macos-arm64
            builder_args: "--mac dir"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install JS workspace & verify TypeScript packages
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm check:ts
          pnpm --filter @superpi/desktop build

      - name: Package self-contained Host sidecar (jlink)
        shell: bash
        run: ./gradlew -Psuperpi.hostOnly=true -Psuperpi.strictBoundaries=true -PsuperpiTargetPlatform=${{ matrix.target_platform }} :apps:host:packageHostDist --no-daemon

      - name: Stage sidecar into Electron resources
        shell: bash
        env:
          SUPERPI_TARGET_PLATFORM: ${{ matrix.target_platform }}
        run: pnpm --filter @superpi/desktop stage:sidecar

      - name: Build Electron desktop bundle
        shell: bash
        working-directory: apps/desktop
        run: pnpm exec electron-builder ${{ matrix.builder_args }} --publish never
