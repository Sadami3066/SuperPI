name: Desktop CI (Windows / macOS / Linux)

on:
  push:
    branches: [main, master]
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "apps/host/**"
      - "core/**"
      - ".github/workflows/ci-desktop.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/web/**"
      - "apps/host/**"
      - "core/**"
      - ".github/workflows/ci-desktop.yml"
  workflow_dispatch:

jobs:
  verify-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target_platform: linux-x64
            tauri_args: "--bundles deb --config src-tauri/tauri.ci.conf.json"
          - os: windows-latest
            target_platform: windows-x64
            tauri_args: "--bundles nsis --config src-tauri/tauri.ci.conf.json"
          - os: macos-latest
            target_platform: macos-arm64
            tauri_args: "--bundles app --config src-tauri/tauri.ci.conf.json"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebKitGTK & Tauri deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install JS workspace & build @superpi/web
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @superpi/web typecheck
          pnpm --filter @superpi/web test
          pnpm --filter @superpi/web build

      - name: Package self-contained Host sidecar (jlink)
        shell: bash
        run: ./gradlew -Psuperpi.hostOnly=true -Psuperpi.strictBoundaries=true -PsuperpiTargetPlatform=${{ matrix.target_platform }} :apps:host:packageHostDist --no-daemon

      - name: Stage sidecar into Tauri resources
        shell: bash
        env:
          SUPERPI_TARGET_PLATFORM: ${{ matrix.target_platform }}
        run: pnpm --filter @superpi/desktop stage:sidecar

      - name: Rust clippy & unit tests
        shell: bash
        working-directory: apps/desktop/src-tauri
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo test

      - name: Build Tauri v2 desktop bundle
        shell: bash
        working-directory: apps/desktop
        run: pnpm tauri build ${{ matrix.tauri_args }}
