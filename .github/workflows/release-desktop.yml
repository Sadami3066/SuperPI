name: Release Super PI Desktop (Windows / macOS / Linux)

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. desktop-v2.0.3) when manually publishing a draft release"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target_platform: linux-x64
            rust_target: x86_64-unknown-linux-gnu
            tauri_args: "--bundles deb,appimage --config src-tauri/tauri.ci.conf.json"
          - os: windows-latest
            target_platform: windows-x64
            rust_target: x86_64-pc-windows-msvc
            tauri_args: "--bundles nsis,msi --config src-tauri/tauri.ci.conf.json"
          - os: macos-latest
            target_platform: macos-arm64
            rust_target: aarch64-apple-darwin
            tauri_args: "--target aarch64-apple-darwin --bundles dmg --config src-tauri/tauri.ci.conf.json"
          - os: macos-15-intel
            target_platform: macos-x64
            rust_target: x86_64-apple-darwin
            tauri_args: "--target x86_64-apple-darwin --bundles dmg --config src-tauri/tauri.ci.conf.json"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libfuse2

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install JS workspace & build @superpi/web
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @superpi/web build

      - name: Package self-contained Host sidecar (jlink)
        shell: bash
        run: ./gradlew -Psuperpi.hostOnly=true -Psuperpi.strictBoundaries=true -PsuperpiTargetPlatform=${{ matrix.target_platform }} :apps:host:packageHostDist --no-daemon

      - name: Stage sidecar into Tauri resources
        shell: bash
        env:
          SUPERPI_TARGET_PLATFORM: ${{ matrix.target_platform }}
        run: pnpm --filter @superpi/desktop stage:sidecar

      - name: Build and upload Tauri v2 release bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          tagName: ${{ inputs.tag_name || github.ref_name }}
          releaseName: "Super PI Desktop ${{ inputs.tag_name || github.ref_name }}"
          releaseBody: "Cross-platform Super PI Desktop installers for Windows (NSIS/MSI), macOS (Apple Silicon & Intel DMG), and Linux (DEB/AppImage)."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.tauri_args }}
