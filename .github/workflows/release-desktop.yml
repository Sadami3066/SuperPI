name: Release Super PI Desktop (Windows / macOS / Linux)

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. desktop-v2.0.3) when manually publishing a draft release"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target_platform: linux-x64
            builder_args: "--linux AppImage deb"
          - os: windows-latest
            target_platform: windows-x64
            builder_args: "--win nsis"
          - os: macos-latest
            target_platform: macos-arm64
            builder_args: "--mac dmg --arm64"
          - os: macos-15-intel
            target_platform: macos-x64
            builder_args: "--mac dmg --x64"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install JS workspace & build Electron app
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @superpi/desktop build

      - name: Package self-contained Host sidecar (jlink)
        shell: bash
        run: ./gradlew -Psuperpi.hostOnly=true -Psuperpi.strictBoundaries=true -PsuperpiTargetPlatform=${{ matrix.target_platform }} :apps:host:packageHostDist --no-daemon

      - name: Stage sidecar into Electron resources
        shell: bash
        env:
          SUPERPI_TARGET_PLATFORM: ${{ matrix.target_platform }}
        run: pnpm --filter @superpi/desktop stage:sidecar

      - name: Build Electron release artifacts
        shell: bash
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec electron-builder ${{ matrix.builder_args }} --publish never

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: "Super PI Desktop ${{ inputs.tag_name || github.ref_name }}"
          body: "Cross-platform Super PI Desktop installers for Windows (NSIS), macOS (Apple Silicon & Intel DMG), and Linux (DEB/AppImage)."
          draft: true
          files: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
