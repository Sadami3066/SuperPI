name: CI · Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/android/**"
      - "core/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/ci-android.yml"
  pull_request:
    paths:
      - "apps/android/**"
      - "core/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "THIRD_PARTY_NOTICES.md"
      - ".github/workflows/ci-android.yml"

concurrency:
  group: ci-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-root-directory: .

      - name: Ensure Android SDK 36
        run: |
          source apps/android/scripts/env.sh
          SDK_ROOT="$(superpi_android_sdk || echo "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}")"
          superpi_ensure_sdk_components "$SDK_ROOT"

      - name: Run full Android verification
        run: ./apps/android/scripts/check.sh --full

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            apps/android/*/build/reports/tests
            apps/android/*/build/reports/lint-results-*
            core/*/build/reports/tests
            build/reports/problems
          if-no-files-found: ignore
