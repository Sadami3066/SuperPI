name: Feature Request
description: Propose a new capability, plugin integration, or UX improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Area
      options:
        - Android App
        - Desktop (Electron)
        - Relay & Shared Memory
        - Official Plugin
        - Plugin API / SDK
        - Documentation / DX
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution or UX
